name: Build artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock", "src/**", "README.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - run: uv sync --frozen
      - run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: python -m venv /tmp/wheel-smoke && /tmp/wheel-smoke/bin/pip install dist/*.whl && /tmp/wheel-smoke/bin/ocr-ci --help
      - run: python -m venv /tmp/sdist-smoke && /tmp/sdist-smoke/bin/pip install dist/*.tar.gz && /tmp/sdist-smoke/bin/ocr-ci --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
