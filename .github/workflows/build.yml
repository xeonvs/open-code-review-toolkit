name: Build artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock", "src/**", "scripts/install_local_artifact.py", "README.md", "LICENSE"]
  push:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock", "src/**", "scripts/install_local_artifact.py", "README.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - run: uv sync --frozen
      - run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: uv run python -m build --no-isolation
      - run: uv run twine check dist/*
      - run: python -m venv /tmp/wheel-smoke && /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl && /tmp/wheel-smoke/bin/ocr-ci --help
      - run: |
          python -m venv /tmp/sdist-smoke
          python scripts/install_local_artifact.py \
            --python /tmp/sdist-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --requirements /tmp/sdist-smoke-requirements.txt
          /tmp/sdist-smoke/bin/ocr-ci --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
