name: Build artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/docs_only.py --base "$BASE" --head "$HEAD"

  build:
    name: build-distributions
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          version: "0.13.4"
      - if: needs.classify.outputs.docs_only != 'true'
        run: uv sync --locked
      - if: needs.classify.outputs.docs_only != 'true'
        run: uv run --no-sync python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - if: needs.classify.outputs.docs_only != 'true'
        run: uv run --no-sync python -m build --no-isolation
      - if: needs.classify.outputs.docs_only != 'true'
        run: uv run --no-sync twine check dist/*
      - if: needs.classify.outputs.docs_only != 'true'
        run: uv export --frozen --no-default-groups --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
      - if: needs.classify.outputs.docs_only != 'true'
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --isolated --disable-pip-version-check --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --retries 3 --timeout 10 --requirement /tmp/runtime-requirements.txt
          python scripts/install_local_artifact.py \
            --python /tmp/wheel-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --requirements /tmp/wheel-smoke-requirements.txt
          /tmp/wheel-smoke/bin/python -m pip check
          (cd /tmp && env -u PYTHONPATH /tmp/wheel-smoke/bin/python -I "${GITHUB_WORKSPACE}/scripts/installed_runtime_smoke.py")
      - if: needs.classify.outputs.docs_only != 'true'
        run: |
          python -m venv /tmp/sdist-smoke
          /tmp/sdist-smoke/bin/pip install --isolated --disable-pip-version-check --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --retries 3 --timeout 10 --requirement /tmp/runtime-requirements.txt
          python scripts/install_local_artifact.py \
            --python /tmp/sdist-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --requirements /tmp/sdist-smoke-requirements.txt
          /tmp/sdist-smoke/bin/python -m pip check
          (cd /tmp && env -u PYTHONPATH /tmp/sdist-smoke/bin/python -I "${GITHUB_WORKSPACE}/scripts/installed_runtime_smoke.py")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
