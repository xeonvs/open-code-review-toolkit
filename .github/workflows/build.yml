name: Build artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock", "src/**", "README.md", "LICENSE"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.11.29"
      - run: uv sync --frozen
      - run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: python -m venv /tmp/wheel-smoke && /tmp/wheel-smoke/bin/pip install dist/*.whl && /tmp/wheel-smoke/bin/ocr-ci --help
      - run: python -m venv /tmp/sdist-smoke && /tmp/sdist-smoke/bin/pip install dist/*.tar.gz && /tmp/sdist-smoke/bin/ocr-ci --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
