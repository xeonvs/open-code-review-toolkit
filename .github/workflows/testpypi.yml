name: TestPyPI development build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testpypi-development
  cancel-in-progress: false

jobs:
  build:
    name: verify-and-build-development
    if: >-
      !(startsWith(github.event.head_commit.message, 'Release v') &&
      contains(github.event.head_commit.message, '(#'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preview.outputs.version }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Install pinned Gitleaks
        run: |
          ./scripts/install_gitleaks.sh "${RUNNER_TEMP}/gitleaks-bin"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - id: preview
        name: Resolve deterministic development version
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          VERSION=$(python scripts/testpypi_preview.py development-version --run-number "${GITHUB_RUN_NUMBER}")
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> "${GITHUB_OUTPUT}"
      - run: uv sync --frozen
      - run: ./scripts/quality.sh check
      - run: uv run pip-audit --skip-editable
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Build deterministic development artifacts
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.preview.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.preview.outputs.source_date_epoch }}
        run: |
          uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          uv run python -m build --no-isolation
          uv run twine check dist/*
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-smoke/bin/ocr-ci --help
          python -m venv /tmp/sdist-smoke
          python scripts/install_local_artifact.py \
            --python /tmp/sdist-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --requirements /tmp/sdist-smoke-requirements.txt
          /tmp/sdist-smoke/bin/ocr-ci --help
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifacts = sorted(Path("dist").iterdir())
          hashes = {
              artifact.name: hashlib.sha256(artifact.read_bytes()).hexdigest()
              for artifact in artifacts
          }
          Path("artifact-hashes.json").write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - id: registry
        name: Check idempotent TestPyPI state
        env:
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --connect-timeout 10 --max-time 120 \
            --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/vnd.pypi.simple.v1+json' \
            https://test.pypi.org/simple/open-code-review-toolkit/ \
            --output /tmp/testpypi-index.json
          STATE=$(python scripts/testpypi_preview.py check-index \
            --version "${VERSION}" \
            --index-json /tmp/testpypi-index.json \
            --hashes-json artifact-hashes.json)
          case "${STATE}" in
            publish) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            already-published) echo "publish=false" >> "${GITHUB_OUTPUT}" ;;
            *) echo "unexpected TestPyPI state: ${STATE}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-development-distributions
          path: |
            dist
            artifact-hashes.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: publish-development
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi-public-disclosure
    permissions:
      contents: read
      id-token: write # TestPyPI Trusted Publishing through OIDC.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-development-distributions
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify:
    name: verify-published-development
    needs: [build, publish]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-development-distributions
      - name: Verify and install immutable published artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --retry-connrefused \
              --connect-timeout 10 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://test.pypi.org/simple/open-code-review-toolkit/ \
              --output /tmp/testpypi-index.json && \
              test "$(python scripts/testpypi_preview.py check-index \
                --version "${VERSION}" \
                --index-json /tmp/testpypi-index.json \
                --hashes-json artifact-hashes.json)" = already-published; then
              break
            fi
            test "${attempt}" -lt 5 || exit 1
            sleep 15
          done
          python scripts/testpypi_preview.py artifact-manifest \
            --version "${VERSION}" \
            --index-json /tmp/testpypi-index.json \
            --hashes-json artifact-hashes.json > /tmp/artifact-manifest.json
          python - <<'PY' > /tmp/artifact-downloads.tsv
          import json
          from pathlib import Path

          for item in json.loads(Path("/tmp/artifact-manifest.json").read_text()):
              print(item["sha256"], item["url"], item["filename"], sep="\t")
          PY
          mkdir -p /tmp/testpypi-artifacts
          while IFS=$'\t' read -r sha256 url filename; do
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --retry-connrefused \
              --connect-timeout 10 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              "${url}" --output "/tmp/testpypi-artifacts/${filename}"
            echo "${sha256}  /tmp/testpypi-artifacts/${filename}" | sha256sum --check --strict
          done < /tmp/artifact-downloads.tsv
          python -m venv /tmp/testpypi-wheel
          /tmp/testpypi-wheel/bin/pip install --no-deps /tmp/testpypi-artifacts/*.whl
          /tmp/testpypi-wheel/bin/ocr-ci --help
          python -m venv /tmp/testpypi-sdist
          python scripts/install_local_artifact.py \
            --python /tmp/testpypi-sdist/bin/python \
            --artifact "$(find /tmp/testpypi-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --requirements /tmp/testpypi-sdist-requirements.txt
          /tmp/testpypi-sdist/bin/ocr-ci --help
