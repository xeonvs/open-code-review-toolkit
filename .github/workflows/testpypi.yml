name: TestPyPI preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused PEP 440 prerelease version, for example 0.1.0a1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-preview
  cancel-in-progress: false

jobs:
  build:
    name: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.11.29"
      - id: validate
        name: Validate preview version and source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          REMOTE_MAIN=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$(git rev-parse HEAD)" = "${REMOTE_MAIN}"
          CANONICAL_VERSION=$(uv run --with packaging python -c 'import os; from packaging.version import Version; print(Version(os.environ["VERSION"]))')
          test "${CANONICAL_VERSION}" = "${VERSION}"
          uv run --with packaging python -c 'import os; from packaging.version import Version; assert Version(os.environ["VERSION"]).is_prerelease'
          case "${VERSION}" in *+*) echo "local versions cannot be published" >&2; exit 1;; esac
          test "$(git tag -l "v${VERSION}")" = ""
          curl --fail --silent --show-error "https://test.pypi.org/pypi/open-code-review-toolkit/${VERSION}/json" >/dev/null && { echo "version ${VERSION} already exists on TestPyPI" >&2; exit 1; } || test "$?" = 22
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - run: uv sync --frozen
      - run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - name: Build preview artifacts
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.validate.outputs.version }}
        run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Verify exact artifact version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          uv run python -c 'import os, pathlib; names=[p.name for p in pathlib.Path("dist").iterdir()]; prefix="open_code_review_toolkit-" + os.environ["VERSION"]; assert len(names) == 2 and all(name.startswith(prefix) for name in names), names'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-distributions-${{ steps.validate.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish-testpypi
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi-public-disclosure
    permissions:
      contents: read
      id-token: write # Exchanged for a short-lived TestPyPI token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-distributions-${{ needs.build.outputs.version }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
      - name: Install published preview
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/testpypi
          for attempt in 1 2 3 4 5; do
            /tmp/testpypi/bin/pip install --no-deps --index-url https://test.pypi.org/simple/ "open-code-review-toolkit==${VERSION}" && break
            test "${attempt}" -lt 5 || exit 1
            sleep 15
          done
          /tmp/testpypi/bin/ocr-ci --help
