name: TestPyPI development build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testpypi-development
  cancel-in-progress: false

jobs:
  build:
    name: verify-and-build-development
    if: >-
      !(startsWith(github.event.head_commit.message, 'Release v') &&
      contains(github.event.head_commit.message, '(#'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.preview.outputs.version }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
      - id: preview
        name: Resolve deterministic development version
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          VERSION=$(python scripts/testpypi_preview.py development-version --run-number "${GITHUB_RUN_NUMBER}")
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> "${GITHUB_OUTPUT}"
      - run: uv sync --locked
      - name: Build deterministic development artifacts
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.preview.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.preview.outputs.source_date_epoch }}
        run: |
          uv run --no-sync python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync twine check dist/*
          uv export --frozen --no-default-groups --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --isolated --disable-pip-version-check --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --retries 3 --timeout 10 --requirement runtime-requirements.txt
          python scripts/install_local_artifact.py \
            --python /tmp/wheel-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --requirements /tmp/wheel-smoke-requirements.txt
          /tmp/wheel-smoke/bin/python -m pip check
          (cd /tmp && env -u PYTHONPATH /tmp/wheel-smoke/bin/python -I "${GITHUB_WORKSPACE}/scripts/installed_runtime_smoke.py")
          python -m venv /tmp/sdist-smoke
          /tmp/sdist-smoke/bin/pip install --isolated --disable-pip-version-check --require-hashes --only-binary=:all: --index-url https://pypi.org/simple --retries 3 --timeout 10 --requirement runtime-requirements.txt
          python scripts/install_local_artifact.py \
            --python /tmp/sdist-smoke/bin/python \
            --artifact "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --requirements /tmp/sdist-smoke-requirements.txt
          /tmp/sdist-smoke/bin/python -m pip check
          (cd /tmp && env -u PYTHONPATH /tmp/sdist-smoke/bin/python -I "${GITHUB_WORKSPACE}/scripts/installed_runtime_smoke.py")
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          artifacts = sorted(Path("dist").iterdir())
          hashes = {
              artifact.name: hashlib.sha256(artifact.read_bytes()).hexdigest()
              for artifact in artifacts
          }
          Path("artifact-hashes.json").write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - id: registry
        name: Check idempotent TestPyPI state
        env:
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --connect-timeout 10 --max-time 120 \
            --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/vnd.pypi.simple.v1+json' \
            https://test.pypi.org/simple/open-code-review-toolkit/ \
            --output /tmp/testpypi-index.json
          STATE=$(python scripts/testpypi_preview.py check-index \
            --version "${VERSION}" \
            --index-json /tmp/testpypi-index.json \
            --hashes-json artifact-hashes.json)
          case "${STATE}" in
            publish) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            already-published) echo "publish=false" >> "${GITHUB_OUTPUT}" ;;
            *) echo "unexpected TestPyPI state: ${STATE}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-development-distributions
          path: |
            dist
            artifact-hashes.json
            runtime-requirements.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: publish-development
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi-public-disclosure
    permissions:
      contents: read
      id-token: write # TestPyPI Trusted Publishing through OIDC.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-development-distributions
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify:
    name: verify-published-development
    needs: [build, publish]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-development-distributions
      - name: Verify provenance and install immutable published artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          ./scripts/verify_registry_artifacts.sh testpypi "${VERSION}"
          artifact-hashes.json testpypi.yml runtime-requirements.txt
