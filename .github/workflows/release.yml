name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.event.repository.private == false &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.review.outputs.approved }}
    steps:
      - id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          approved=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq --arg author "${PR_AUTHOR}" '[.[] | select(.state == "APPROVED" and .user.login != $author)] | length > 0')
          test "${approved}" = true
          echo "approved=true" >> "${GITHUB_OUTPUT}"

  build:
    if: >-
      github.event.repository.private == false &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      startsWith(github.event.pull_request.title, 'Release v')
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
      - id: validate
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          test "${REPOSITORY_PRIVATE}" = "false"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          test -f .release-version
          VERSION=$(cat .release-version)
          test "${RELEASE_BRANCH}" = "release/v${VERSION}"
          CANONICAL_VERSION=$(uv run python -c "from packaging.version import Version; print(Version('${VERSION}'))")
          test "${CANONICAL_VERSION}" = "${VERSION}"
          case "${VERSION}" in *+*) echo "local versions cannot be published" >&2; exit 1;; esac
          test "$(git tag -l "v${VERSION}")" = ""
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          git config user.name "release automation"
          git config user.email "release-automation@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" "${EXPECTED_COMMIT}"
      - run: uv sync --frozen
      - run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Verify exact artifact version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          uv run python -c "import pathlib; names=[p.name for p in pathlib.Path('dist').iterdir()]; prefix='open_code_review_toolkit-' + '${VERSION}'; assert len(names) == 2 and all(name.startswith(prefix) for name in names), names"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Push validated tag and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git push origin "${TAG}"
          gh release create "${TAG}" dist/* --draft --verify-tag --title "${TAG}" --generate-notes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-distributions
          path: dist/

  testpypi:
    needs: [authorize, build]
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    environment: testpypi-public-disclosure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python -m venv /tmp/testpypi && /tmp/testpypi/bin/pip install --no-deps --index-url https://test.pypi.org/simple/ "open-code-review-toolkit==${VERSION}" && /tmp/testpypi/bin/ocr-ci --help

  pypi:
    needs: [authorize, build, testpypi]
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    environment: pypi-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python -m venv /tmp/pypi && /tmp/pypi/bin/pip install --no-deps "open-code-review-toolkit==${VERSION}" && /tmp/pypi/bin/ocr-ci --help
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false
