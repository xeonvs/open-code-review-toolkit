name: OCR compatibility

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact stable upstream tag, for example v1.7.18
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ocr-compatibility
  cancel-in-progress: false

jobs:
  discover:
    name: discover-stable-releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate support manifest
        run: PYTHONPATH=src python scripts/ocr_compat.py validate
      - name: Discover unseen stable releases
        if: inputs.tag == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/ocr_compat.py discover --output /tmp/ocr-releases.json
      - name: Use requested stable release
        if: inputs.tag != ''
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["REQUESTED_TAG"]
          if re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag) is None:
              raise SystemExit("requested tag must be a stable semantic version")
          normalized = tag if tag.startswith("v") else f"v{tag}"
          Path("/tmp/ocr-releases.json").write_text(
              json.dumps({"releases": [{"tag_name": normalized}]}) + "\n",
              encoding="utf-8",
          )
          PY
      - id: matrix
        name: Build bounded qualification matrix
        run: |
          PYTHONPATH=src python scripts/ocr_compat.py build-matrix \
            --releases /tmp/ocr-releases.json \
            --output /tmp/ocr-matrix.json
          echo "matrix=$(tr -d '\n' </tmp/ocr-matrix.json)" >>"${GITHUB_OUTPUT}"
          echo "count=$(python -c 'import json; print(len(json.load(open("/tmp/ocr-matrix.json"))["include"]))')" >>"${GITHUB_OUTPUT}"

  qualify:
    name: qualify-${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Qualify candidate
        env:
          CANDIDATE_TAG: ${{ matrix.tag }}
          COMPARISON_VERSION: ${{ matrix.comparison_version }}
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_BASELINE_VERSION: ${{ matrix.tested_baseline_version }}
        run: |
          mkdir -p /tmp/ocr-compat
          PYTHONPATH=src python scripts/ocr_compat.py qualify \
            --tag "${CANDIDATE_TAG}" \
            --comparison-version "${COMPARISON_VERSION}" \
            --tested-baseline-version "${TESTED_BASELINE_VERSION}" \
            --output /tmp/ocr-compat/evidence.json \
            --issue-body /tmp/ocr-compat/issue.md
      - name: Upsert qualification issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PYTHONPATH=src python scripts/ocr_compat.py upsert-issue \
            --evidence /tmp/ocr-compat/evidence.json \
            --repository "${REPOSITORY}" \
            --run-url "${RUN_URL}" \
            --output-number /tmp/ocr-compat/issue-number.txt
          issue=$(tr -d '[:space:]' </tmp/ocr-compat/issue-number.txt)
          case "${issue}" in
            ''|*[!0-9]*) echo "invalid qualification issue number: ${issue}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-compatibility-${{ matrix.tag }}
          path: /tmp/ocr-compat/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: assess-complete-chain
    needs: [discover, qualify]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocr-compatibility-v*
          path: /tmp/ocr-chain
      - name: Assess the complete observed release chain
        id: chain
        run: |
          mapfile -d '' evidence_files < <(find /tmp/ocr-chain -name evidence.json -type f -print0)
          test "${#evidence_files[@]}" -eq "${{ needs.discover.outputs.count }}"
          args=()
          for evidence in "${evidence_files[@]}"; do
            args+=(--evidence "${evidence}")
          done
          PYTHONPATH=src python scripts/ocr_compat.py assess-chain \
            "${args[@]}" \
            --output /tmp/ocr-chain-assessment.json
          classification=$(python -c 'import json; print(json.load(open("/tmp/ocr-chain-assessment.json"))["classification"])')
          target=$(python -c 'import json; print(json.load(open("/tmp/ocr-chain-assessment.json"))["target_version"])')
          echo "classification=${classification}" >>"${GITHUB_OUTPUT}"
          echo "target=${target}" >>"${GITHUB_OUTPUT}"
      - name: Prepare one cumulative automatic-safe patch
        if: steps.chain.outputs.classification == 'automatic-safe'
        env:
          TARGET_VERSION: ${{ steps.chain.outputs.target }}
        run: |
          mapfile -d '' evidence_files < <(find /tmp/ocr-chain -name evidence.json -type f -print0)
          args=()
          latest_issue=''
          for evidence in "${evidence_files[@]}"; do
            args+=(--evidence "${evidence}")
            version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "${evidence}")
            if [ "${version}" = "${TARGET_VERSION}" ]; then
              latest_issue=$(tr -d '[:space:]' <"$(dirname "${evidence}")/issue-number.txt")
            fi
          done
          case "${latest_issue}" in
            ''|*[!0-9]*) echo "invalid target qualification issue number: ${latest_issue}" >&2; exit 1 ;;
          esac
          PYTHONPATH=src python scripts/ocr_compat.py prepare-update \
            "${args[@]}" \
            --fragment-number "${latest_issue}"
          git diff --binary >"/tmp/ocr-chain-update.patch"
          test -s /tmp/ocr-chain-update.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-compatibility-chain
          path: |
            /tmp/ocr-chain-assessment.json
            /tmp/ocr-chain-update.patch
          if-no-files-found: error
          retention-days: 7
      - name: Open automatic-safe compatibility PR when bot credential is configured
        if: steps.chain.outputs.classification == 'automatic-safe'
        env:
          GH_TOKEN: ${{ secrets.OCR_UPDATE_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ steps.chain.outputs.target }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "OCR_UPDATE_BOT_TOKEN is not configured; patch artifact and issue are the resume path."
            exit 0
          fi
          version=${TARGET_VERSION}
          branch="automation/ocr-${version}"
          bot_login=$(gh api user --jq .login)
          if [ "${bot_login}" = "github-actions[bot]" ]; then
            echo "OCR_UPDATE_BOT_TOKEN must identify a non-Actions bot so PR workflows run." >&2
            exit 1
          fi
          git config user.name "OCR compatibility automation"
          git config user.email "ocr-compatibility@users.noreply.github.com"
          gh auth setup-git
          git fetch origin "${branch}" || true
          git switch -C "${branch}" "${GITHUB_SHA}"
          git add compatibility/ocr-support.json compatibility/evidence/ \
            src/ocr_toolkit/preflight.py examples/gitlab/ocr-review.gitlab-ci.yml \
            README.md docs/gitlab.md docs/security.md changelog.d/
          git commit -m "Target OCR ${version}"
          git push --force-with-lease="${branch}" origin "${branch}"
          existing=$(gh pr list --repo "${REPOSITORY}" --state open --head "${branch}" --json number --jq '.[0].number // empty')
          if [ -z "${existing}" ]; then
            gh pr create --repo "${REPOSITORY}" \
              --base main \
              --head "${branch}" \
              --title "Target OCR ${version}" \
              --label dependencies \
              --body "Checksum-verified automatic-safe OCR compatibility update. Machine evidence and the exact generated patch are attached to workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This PR does not publish a release; merge remains subject to every protected check and the separate stable release workflow."
          fi
