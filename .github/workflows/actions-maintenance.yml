name: Actions storage maintenance

on:
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the objects selected by the bounded cleanup plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: actions-storage-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup-actions-storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # Delete only the bounded cache, artifact, and log plan.
      contents: read # Check out the reviewed cleanup implementation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Plan or execute bounded cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTE_CLEANUP: ${{ github.event_name == 'schedule' || inputs.execute }}
        run: |
          args=()
          if [ "${EXECUTE_CLEANUP}" = "true" ]; then
            args+=(--execute)
          fi
          python scripts/actions_cleanup.py "${args[@]}"
