name: Security

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          result=docs_only=false
          trusted_script="$RUNNER_TEMP/docs_only.py"
          if git show "${BASE}:scripts/docs_only.py" > "$trusted_script"; then
            if output=$(env -u GITHUB_OUTPUT python "$trusted_script" --base "$BASE" --head "$HEAD"); then
              case "$output" in
                docs_only=true|docs_only=false) result="$output" ;;
              esac
            fi
          fi
          echo "$result" >> "$GITHUB_OUTPUT"

  sast-bandit:
    name: sast-bandit
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          version: "0.13.4"
      - if: needs.classify.outputs.docs_only != 'true'
        run: ./scripts/quality.sh security

  dependency-audit:
    name: dependency-audit
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          version: "0.13.4"
      - if: needs.classify.outputs.docs_only != 'true'
        run: ./scripts/dependency-audit.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Gitleaks reads PR refs; comments are disabled.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load pinned Gitleaks version
        run: |
          version=$(./scripts/gitleaks.sh --version)
          echo "GITLEAKS_VERSION=${version}" >> "${GITHUB_ENV}"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
