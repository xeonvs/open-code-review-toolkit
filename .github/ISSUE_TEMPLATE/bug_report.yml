name: Bug report
description: Report reproducible toolkit behavior with synthetic inputs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, proprietary source, or private provider payloads.
  - type: input
    id: version
    attributes:
      label: Toolkit version
      placeholder: 0.1.0a1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and synthetic reproducer
    validations:
      required: true
