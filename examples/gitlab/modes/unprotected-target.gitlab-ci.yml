variables:
  # Explicitly permit an unprotected target; protected targets keep normal behavior.
  OCR_GITLAB_TARGET_PROTECTION_MODE: "unprotected"
  # Only "off" and bounded untrusted "metadata" are allowed for an actual unprotected target.
  OCR_REVIEW_CONTEXT_MODE: "metadata"
  # Defense in depth; receipt v8 also makes an actual unprotected target ineligible.
  OCR_AUTO_APPROVE: "false"
