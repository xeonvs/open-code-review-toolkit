stages:
  - lint
  - ai_review

default:
  image: python:3.12-slim

variables:
  OCR_VERSION: "v1.9.9"
  OCR_TOOLKIT_VERSION: "0.7.1"
  OCR_TOOLKIT_CHECKSUMS_URL: "https://github.com/xeonvs/open-code-review-toolkit/releases/download/v${OCR_TOOLKIT_VERSION}/SHA256SUMS"
  OCR_SHA256: "52f993c615a6b456cb1c36fc135fec6b8da19cb88da7f305bd2726c3d72f1cf0"
  OCR_POST_MODE: "draft"
  OCR_STRICT_POSTING: "true"
  # Default-on receipt-bound approval; external MCP always remains comment-only.
  OCR_AUTO_APPROVE: "true"
  # Identity-only by default; use "metadata" to admit bounded MR text fields.
  OCR_REVIEW_CONTEXT_MODE: "off"
  # Optional remote category/severity images; text is the private-safe default.
  # OCR_POST_BADGES: "shields"
  OCR_LLM_VALIDATE_MODEL: "false"
  OCR_LLM_ALLOWED_MODELS: ""
  OCR_RUN_HELPER_TESTS: "false"
  # Optional aggregate review ceiling; 0 keeps OCR's unlimited default.
  OCR_MAX_TOKENS_BUDGET: "0"
  # Reviews default to English. To request another language, for example Russian, set:
  # OCR_REVIEW_LANGUAGE: "Russian"

lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - echo "Run the repository's own required lint and test commands here before AI review"

open_code_review:
  stage: ai_review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  timeout: 30m
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
    - >-
      curl --fail --location --silent --show-error
      --retry 3 --retry-delay 2 --retry-connrefused
      --connect-timeout 10 --max-time 120
      --proto '=https' --proto-redir '=https'
      "https://github.com/alibaba/open-code-review/releases/download/${OCR_VERSION}/opencodereview-linux-amd64"
      --output /usr/local/bin/ocr
    - echo "${OCR_SHA256}  /usr/local/bin/ocr" | sha256sum --check --strict
    - chmod 0755 /usr/local/bin/ocr
    - >-
      curl --fail --location --silent --show-error
      --retry 3 --retry-delay 2 --retry-connrefused
      --connect-timeout 10 --max-time 120
      --proto '=https' --proto-redir '=https'
      "${OCR_TOOLKIT_CHECKSUMS_URL}"
      --output /tmp/open-code-review-toolkit-SHA256SUMS
    - export OCR_TOOLKIT_WHEEL="open_code_review_toolkit-${OCR_TOOLKIT_VERSION}-py3-none-any.whl"
    - export OCR_TOOLKIT_WHEEL_SHA256="$(awk -v file="${OCR_TOOLKIT_WHEEL}" '$2 == file { print $1 }' /tmp/open-code-review-toolkit-SHA256SUMS)"
    - echo "${OCR_TOOLKIT_WHEEL_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
    - echo "open-code-review-toolkit==${OCR_TOOLKIT_VERSION} --hash=sha256:${OCR_TOOLKIT_WHEEL_SHA256}" > /tmp/ocr-toolkit-requirement.txt
    - >-
      pip download --isolated --disable-pip-version-check
      --require-hashes --no-deps --only-binary=:all:
      --retries 3 --timeout 10
      --index-url https://pypi.org/simple
      --dest /tmp --requirement /tmp/ocr-toolkit-requirement.txt
    - echo "${OCR_TOOLKIT_WHEEL_SHA256}  /tmp/${OCR_TOOLKIT_WHEEL}" | sha256sum --check --strict
    - pip install --no-deps "/tmp/${OCR_TOOLKIT_WHEEL}"
    - if [ "${OCR_RUN_HELPER_TESTS:-false}" = "true" ]; then uv run pytest tests; fi
    - ocr-ci preflight
    - ocr-ci configure
    - export OCR_LLM_TOKEN="${OCR_LLM_TOKEN}"
    - ocr-ci review --result /tmp/ocr-result.json --stderr /tmp/ocr-stderr.log -- --from "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" --to "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA}" --rule examples/gitlab/rules.json --format json --max-tokens-budget "${OCR_MAX_TOKENS_BUDGET:-0}" || export OCR_EXIT_CODE=$?
    - ocr-ci post --result /tmp/ocr-result.json --stderr /tmp/ocr-stderr.log

open_code_review_self_test:
  stage: ai_review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  script:
    - env -u OCR_LLM_TOKEN ocr-ci preflight
