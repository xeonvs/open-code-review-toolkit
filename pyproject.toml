[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "open-code-review-toolkit"
dynamic = ["version"]
description = "Unofficial GitLab CI integration layer for Open Code Review"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Open Code Review Toolkit contributors" }]
keywords = ["code-review", "gitlab", "ci", "open-code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xeonvs/open-code-review-toolkit"
Repository = "https://github.com/xeonvs/open-code-review-toolkit"
Issues = "https://github.com/xeonvs/open-code-review-toolkit/issues"
Changelog = "https://github.com/xeonvs/open-code-review-toolkit/blob/main/CHANGELOG.md"
"Code of Conduct" = "https://github.com/xeonvs/open-code-review-toolkit/blob/main/CODE_OF_CONDUCT.md"

[project.scripts]
ocr-ci = "ocr_toolkit.cli:main"

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "build>=1.5.0",
  "coverage[toml]>=7.15.2",
  "hatch-vcs>=0.5.0",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
  "towncrier>=25.8.0",
  "twine>=7.0.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ocr_toolkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_toolkit"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.version.raw-options]
fallback_version = "0.3.0.dev0"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# These upgrade rules describe a separate future modernization of the existing
# codebase; changing the minimum runtime must not silently rewrite public types.
ignore = ["E402", "E501", "E731", "B007", "B023", "B905", "SIM103", "SIM105", "SIM117", "RUF002", "RUF012", "UP017", "UP022", "UP040", "UP042", "UP045", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/ocr_toolkit/_version.py" = ["I001", "RUF022"]

[tool.ruff.format]
exclude = ["src/ocr_toolkit/_version.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ocr_toolkit"]
exclude = ["src/ocr_toolkit/_version.py"]
warn_unreachable = false
disable_error_code = ["arg-type", "assignment", "import-not-found", "index", "name-defined", "no-any-return", "no-redef", "union-attr", "unused-ignore", "var-annotated"]

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ocr_toolkit"]
omit = ["src/ocr_toolkit/_version.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.towncrier]
package = "ocr_toolkit"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/xeonvs/open-code-review-toolkit/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "🚀 Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "🐛 Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "🛠 Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "refactor"
name = "🔧 Refactoring"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "📖 Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "rules"
name = "🧩 Rules"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true
